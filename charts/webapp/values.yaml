# Default values. Environment overrides live in environments/*.yaml

replicaCount: 2

image:
  repository: ghcr.io/stefanprodan/podinfo
  tag: ""  # defaults to the chart appVersion
  pullPolicy: IfNotPresent

serviceAccount:
  automountToken: false

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: webapp.local
  path: /
  tls:
    enabled: false
    secretName: ""

config:
  logLevel: info
  message: "Hello from Helm"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx

rollout:
  maxUnavailable: 0
  maxSurge: 1
