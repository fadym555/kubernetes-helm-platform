{{- if .Values.networkPolicy.enabled }}
# Default-deny for the app pods: only the ingress controller and pods
# explicitly labelled as clients of this release can reach them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
        - podSelector:
            matchLabels:
              {{ include "webapp.fullname" . }}-client: "true"
      ports:
        - port: http
          protocol: TCP
{{- end }}
